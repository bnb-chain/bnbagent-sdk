<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#546E7A"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="#FFFFFF"/>
  <text x="480" y="30" font-size="17" font-weight="bold" fill="#212121" text-anchor="middle">One evaluation call, three points of trust on BNB Chain</text>

  <!-- inputs -->
  <rect x="20" y="70" width="240" height="120" rx="8" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.5"/>
  <text x="140" y="95" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle">What is evaluated</text>
  <text x="36" y="120" font-size="12" fill="#37474F">• answers and documents</text>
  <text x="36" y="140" font-size="12" fill="#37474F">• multi-turn conversations</text>
  <text x="36" y="160" font-size="12" fill="#37474F">• tool and agent trajectories</text>
  <text x="36" y="180" font-size="12" fill="#37474F">• on-chain transactions</text>

  <rect x="20" y="210" width="240" height="120" rx="8" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.5"/>
  <text x="140" y="235" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle">Suite (agreed criteria)</text>
  <text x="36" y="260" font-size="12" fill="#37474F">• metrics and thresholds</text>
  <text x="36" y="280" font-size="12" fill="#37474F">• required metrics, pass rule</text>
  <text x="36" y="300" font-size="12" fill="#37474F">• judge model and prompt versions</text>
  <text x="36" y="320" font-size="12" fill="#37474F">• hashed and lockable</text>

  <!-- engine -->
  <rect x="320" y="70" width="300" height="260" rx="10" fill="#FFF8E1" stroke="#F0B90B" stroke-width="2.5"/>
  <text x="470" y="98" font-size="15" font-weight="bold" fill="#5D4037" text-anchor="middle">bnbagent-eval</text>
  <text x="470" y="118" font-size="12" fill="#5D4037" text-anchor="middle">EvalClient.evaluate(suite, cases)</text>
  <line x1="340" y1="132" x2="600" y2="132" stroke="#F0B90B" stroke-width="1"/>
  <text x="340" y="156" font-size="12" fill="#3E2723">99 metrics in 12 categories</text>
  <text x="340" y="176" font-size="12" fill="#3E2723">rule · LLM judge · local model</text>
  <text x="340" y="196" font-size="12" fill="#3E2723">optional third-party methods</text>
  <line x1="340" y1="212" x2="600" y2="212" stroke="#F0B90B" stroke-width="1"/>
  <text x="340" y="236" font-size="12" font-weight="bold" fill="#3E2723">One result</text>
  <text x="340" y="256" font-size="12" fill="#3E2723">scores in [0, 1] with reasons</text>
  <text x="340" y="276" font-size="12" fill="#3E2723">verdict: pass / fail / inconclusive</text>
  <text x="340" y="296" font-size="12" fill="#3E2723">result_hash (reproducible)</text>
  <text x="340" y="316" font-size="12" fill="#3E2723">optional EIP-712 attestation</text>

  <line x1="260" y1="130" x2="316" y2="170" stroke="#546E7A" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="260" y1="270" x2="316" y2="230" stroke="#546E7A" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- uses -->
  <rect x="680" y="60" width="260" height="78" rx="8" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1.5"/>
  <text x="696" y="84" font-size="13" font-weight="bold" fill="#0D47A1">S1 Register · ERC-8004</text>
  <text x="696" y="106" font-size="12" fill="#1A237E">measured quality in the agent's</text>
  <text x="696" y="124" font-size="12" fill="#1A237E">registration file</text>

  <rect x="680" y="161" width="260" height="78" rx="8" fill="#E8F5E9" stroke="#81C784" stroke-width="1.5"/>
  <text x="696" y="185" font-size="13" font-weight="bold" fill="#1B5E20">S2 Work · ERC-8183</text>
  <text x="696" y="207" font-size="12" fill="#1B5E20">provider self-check, dispute advice,</text>
  <text x="696" y="225" font-size="12" fill="#1B5E20">evidence bound to the job</text>

  <rect x="680" y="262" width="260" height="78" rx="8" fill="#F3E5F5" stroke="#BA68C8" stroke-width="1.5"/>
  <text x="696" y="286" font-size="13" font-weight="bold" fill="#4A148C">S3 Serve · x402</text>
  <text x="696" y="308" font-size="12" fill="#4A148C">independent evaluation over HTTP,</text>
  <text x="696" y="326" font-size="12" fill="#4A148C">paid per request</text>

  <line x1="620" y1="160" x2="676" y2="100" stroke="#546E7A" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="620" y1="200" x2="676" y2="200" stroke="#546E7A" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="620" y1="240" x2="676" y2="300" stroke="#546E7A" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- foundation -->
  <rect x="20" y="360" width="920" height="52" rx="8" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="480" y="382" font-size="12" fill="#37474F" text-anchor="middle">Core: pure Python, three dependencies, no chain code. Chain access through small ports:</text>
  <text x="480" y="400" font-size="12" fill="#37474F" text-anchor="middle">bnbagent SDK adapter (ERC-8004 / ERC-8183), JSON-RPC adapter for any EVM chain, or none.</text>
</svg>
