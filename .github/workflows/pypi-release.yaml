name: Release bnbagent to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string
      release_to_prod:
        description: 'Release to production PyPI (unchecked = test PyPI)'
        required: false
        default: false
        type: boolean

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # Required for trusted publishing to PyPI
    defaults:
      run:
        working-directory: python  # Python project lives under python/ (polyglot monorepo)

    steps:
      - name: Validate release inputs
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_TO_PROD: ${{ inputs.release_to_prod }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        working-directory: .
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TO_PROD" == "true" ]]; then
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Production version must be X.Y.Z, got: $VERSION" >&2
              exit 1
            fi
            if [[ "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
              echo "Production releases must be dispatched from $DEFAULT_BRANCH, got: $REF_NAME" >&2
              exit 1
            fi
          else
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc|\.dev)[0-9]+)?$ ]]; then
              echo "Test PyPI version must match X.Y.Z or X.Y.Z(a|b|rc|.dev)N, got: $VERSION" >&2
              exit 1
            fi
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tags and branch reachability
          persist-credentials: false

      - name: Verify commit belongs to a repository branch
        working-directory: .
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          HEAD_SHA="$(git rev-parse --verify HEAD)"
          if [[ -z "$(git branch -r --contains "$HEAD_SHA" 'origin/*')" ]]; then
            echo "Refusing release: $HEAD_SHA is not reachable from any branch of $GITHUB_REPOSITORY" >&2
            exit 1
          fi

      - name: Resolve previous component tag
        # Must run BEFORE the target tag is created, otherwise git describe
        # would find the tag being released and produce an empty range.
        if: ${{ inputs.release_to_prod }}
        id: tags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TARGET_TAG="bnbagent-v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TARGET_TAG" >/dev/null; then
            echo "Refusing to release: tag $TARGET_TAG already exists" >&2
            exit 1
          fi
          PREVIOUS_TAG="$(git describe --tags --match 'bnbagent-v[0-9]*' --abbrev=0 2>/dev/null || true)"
          echo "target_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: ${{ inputs.release_to_prod }}
        env:
          VERSION: ${{ inputs.version }}
          TARGET_TAG: ${{ steps.tags.outputs.target_tag }}
          PREVIOUS_TAG: ${{ steps.tags.outputs.previous_tag }}
        working-directory: .
        run: |
          set -euo pipefail
          if [[ -n "$PREVIOUS_TAG" ]]; then
            RANGE="$PREVIOUS_TAG..HEAD"
          else
            RANGE="HEAD"
          fi
          # Scope to this component: python/ plus the shared repo-root abis/
          # (vendored into the wheel/sdist by hatch_build.py). :(top) anchors
          # the pathspecs to the repo root regardless of the working directory.
          CHANGES="$(git log --no-merges --pretty='format:- %s (%h)' "$RANGE" \
            -- ':(top)python/' ':(top)abis/')"
          {
            echo "## bnbagent v$VERSION"
            echo
            echo "Python SDK for ERC-8004 on-chain agent registration and management."
            echo
            echo "### Installation"
            echo
            echo '```bash'
            echo "pip install bnbagent==$VERSION"
            echo '```'
            echo
            echo "### What's Changed"
            echo
            if [[ -n "$CHANGES" ]]; then
              echo "$CHANGES"
            else
              echo "_No notable changes._"
            fi
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...$TARGET_TAG"
            fi
          } > RELEASE_NOTES.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev

      - name: Run tests
        run: |
          uv run pytest -v

      - name: Update version in _version.py
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:(?:a|b|rc|\.dev)[0-9]+)?", version):
              raise SystemExit(f"Invalid version format: {version!r}")

          version_file = Path("bnbagent/_version.py")
          if version_file.is_symlink():
              raise SystemExit("Refusing symlinked bnbagent/_version.py")
          content = version_file.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'^__version__\s*=\s*"[^"]*"',
              f'__version__ = "{version}"',
              content,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("Failed to update __version__ in bnbagent/_version.py")
          version_file.write_text(updated, encoding="utf-8")
          print(f"Updated version to {version}")
          PYTHON

      - name: Build package
        run: |
          rm -rf dist
          uv build
          rm -f dist/.gitignore

      - name: Verify built wheel, sdist, ABIs, and smoke install
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import os
          import posixpath
          import tarfile
          import zipfile
          from email.parser import Parser
          from pathlib import Path

          version = os.environ["VERSION"]
          dist_dir = Path("dist")
          expected_wheel = dist_dir / f"bnbagent-{version}-py3-none-any.whl"
          expected_sdist = dist_dir / f"bnbagent-{version}.tar.gz"

          actual_files = sorted(p for p in dist_dir.iterdir() if p.is_file())
          if actual_files != sorted([expected_wheel, expected_sdist]):
              raise SystemExit(
                  f"Unexpected files in dist/: {[p.name for p in actual_files]}"
              )

          repo_abis = {
              p.name: hashlib.sha256(p.read_bytes()).hexdigest()
              for p in Path("../abis").glob("*.json")
          }
          if not repo_abis:
              raise SystemExit("No ABI files found in ../abis")

          # 1. Inspect wheel (.whl)
          with zipfile.ZipFile(expected_wheel, "r") as zf:
              names = zf.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit("Duplicate entry names in wheel")
              for name in names:
                  if name.startswith("/") or ".." in name.split("/"):
                      raise SystemExit(f"Unsafe path in wheel: {name}")
              metadata_path = f"bnbagent-{version}.dist-info/METADATA"
              if metadata_path not in names:
                  raise SystemExit(f"Missing {metadata_path} in wheel")
              meta = Parser().parsestr(zf.read(metadata_path).decode("utf-8"))
              if meta.get("Name") != "bnbagent" or meta.get("Version") != version:
                  raise SystemExit(
                      f"Wheel METADATA mismatch: Name={meta.get('Name')!r}, Version={meta.get('Version')!r}"
                  )
              wheel_abis = {
                  posixpath.basename(n): hashlib.sha256(zf.read(n)).hexdigest()
                  for n in names
                  if n.startswith("bnbagent/abis/") and n.endswith(".json")
              }
              if wheel_abis != repo_abis:
                  raise SystemExit("Wheel ABIs do not match repo-root ../abis/*.json")

          # 2. Inspect sdist (.tar.gz)
          with tarfile.open(expected_sdist, "r:gz") as tf:
              seen_tar = set()
              pkg_info_bytes = None
              for member in tf.getmembers():
                  if not (member.isreg() or member.isdir()):
                      raise SystemExit(
                          f"Disallowed tar member type for {member.name!r}: {member.type!r}"
                      )
                  if member.name.startswith("/") or ".." in member.name.split("/"):
                      raise SystemExit(f"Unsafe path in sdist: {member.name}")
                  norm = posixpath.normpath(member.name)
                  if not (
                      norm == f"bnbagent-{version}"
                      or norm.startswith(f"bnbagent-{version}/")
                  ):
                      raise SystemExit(f"Unexpected root in sdist: {norm}")
                  if norm in seen_tar:
                      raise SystemExit(f"Duplicate tar member in sdist: {norm}")
                  seen_tar.add(norm)
                  if norm == f"bnbagent-{version}/PKG-INFO":
                      f = tf.extractfile(member)
                      assert f is not None
                      pkg_info_bytes = f.read()
              if pkg_info_bytes is None:
                  raise SystemExit("Missing PKG-INFO in sdist")
              pkg_info = Parser().parsestr(pkg_info_bytes.decode("utf-8"))
              if pkg_info.get("Name") != "bnbagent" or pkg_info.get("Version") != version:
                  raise SystemExit(
                      f"sdist PKG-INFO mismatch: Name={pkg_info.get('Name')!r}, Version={pkg_info.get('Version')!r}"
                  )
          PYTHON

          SMOKE_VENV="$RUNNER_TEMP/smoke-venv"
          uv venv "$SMOKE_VENV"
          uv pip install --python "$SMOKE_VENV/bin/python" --no-deps "dist/bnbagent-${VERSION}-py3-none-any.whl"
          "$SMOKE_VENV/bin/python" -c 'import os, bnbagent; assert bnbagent.__version__ == os.environ["VERSION"], bnbagent.__version__'

      - name: Commit version update through the GitHub API
        if: success() && inputs.release_to_prod
        id: version_commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet HEAD -- bnbagent/_version.py; then
            echo "Version file already up to date; nothing to commit"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # GitHub signs this commit; no bot GPG private key is needed.
          COMMIT_REQUEST="$(mktemp)"
          trap 'rm -f "$COMMIT_REQUEST"' EXIT
          python - <<'PYTHON' > "$COMMIT_REQUEST"
          import base64
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          mutation = """
          mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit { oid signature { isValid wasSignedByGitHub } }
            }
          }
          """
          payload = {
              "branch": {
                  "repositoryNameWithOwner": os.environ["GITHUB_REPOSITORY"],
                  "branchName": os.environ["GITHUB_REF_NAME"],
              },
              "expectedHeadOid": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "message": {"headline": f'chore: bump version to {os.environ["VERSION"]}'},
              "fileChanges": {
                  "additions": [{
                      "path": "python/bnbagent/_version.py",
                      "contents": base64.b64encode(Path("bnbagent/_version.py").read_bytes()).decode(),
                  }],
              },
          }
          json.dump({"query": mutation, "variables": {"input": payload}}, sys.stdout)
          PYTHON
          COMMIT_RESPONSE="$(gh api graphql --input "$COMMIT_REQUEST")"
          if ! VERSION_COMMIT_SHA="$(jq -er '
            .data.createCommitOnBranch.commit
            | select(.signature.isValid == true and .signature.wasSignedByGitHub == true)
            | .oid | select(test("^[0-9a-f]{40}$"))
          ' <<< "$COMMIT_RESPONSE")"; then
            echo "GitHub did not return a verified version commit; refusing to tag" >&2
            exit 1
          fi
          echo "commit_sha=$VERSION_COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Check whether the version is already on PyPI with matching digests
        # Recovery path: if a previous run published to PyPI but failed before
        # the tag/Release, skip the duplicate upload only when the remote
        # wheel and sdist SHA-256 digests match our locally verified artifacts.
        if: ${{ inputs.release_to_prod }}
        id: pypi
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          EXISTS="$(
            python - <<'PYTHON'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          version = os.environ["VERSION"]
          url = f"https://pypi.org/pypi/bnbagent/{version}/json"
          try:
              with urllib.request.urlopen(url, timeout=15) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print("false")
                  raise SystemExit(0)
              raise

          local_digests = {
              p.name: hashlib.sha256(p.read_bytes()).hexdigest()
              for p in Path("dist").iterdir()
              if p.is_file()
          }
          remote_urls = data.get("urls") or []
          remote_digests = {
              entry.get("filename"): (entry.get("digests") or {}).get("sha256")
              for entry in remote_urls
          }
          if remote_digests != local_digests:
              raise SystemExit(
                  f"Refusing to skip bnbagent {version}: PyPI digests {remote_digests} do not match local dist {local_digests}"
              )
          print("true")
          PYTHON
          )"
          if [[ "$EXISTS" == "true" ]]; then
            echo "bnbagent $VERSION is already on PyPI with matching SHA-256 digests; skipping upload"
          fi
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"

      - name: Publish to Production PyPI
        if: ${{ inputs.release_to_prod && steps.pypi.outputs.exists != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./python/dist/
          print-hash: true
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Uses trusted publishing (OIDC) - no token needed
          # Configure OIDC in PyPI account settings: https://pypi.org/manage/account/publishing/

      - name: Publish to Test PyPI
        if: ${{ !inputs.release_to_prod }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./python/dist/
          print-hash: true
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          # For Test PyPI, you can use trusted publishing or API token
          # If using API token, set TEST_PYPI_API_TOKEN secret

      - name: Create Git tag
        if: success() && inputs.release_to_prod
        env:
          TARGET_TAG: ${{ steps.tags.outputs.target_tag }}
          RELEASE_SHA: ${{ steps.version_commit.outputs.commit_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The API updates the remote branch, while local HEAD stays at checkout.
          git fetch --no-tags origin "$RELEASE_SHA"
          git tag -a "$TARGET_TAG" -m "Release bnbagent v$VERSION" "$RELEASE_SHA"
          git push origin "$TARGET_TAG"

      - name: Create GitHub Release
        if: success() && inputs.release_to_prod
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tags.outputs.target_tag }}
          name: bnbagent v${{ inputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          make_latest: true
