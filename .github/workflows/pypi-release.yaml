name: Release bnbagent to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string
      release_to_prod:
        description: 'Release to production PyPI (unchecked = test PyPI)'
        required: false
        default: false
        type: boolean
      skip_tests:
        description: 'Skip tests before release'
        required: false
        default: false
        type: boolean

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # Required for trusted publishing to PyPI
    defaults:
      run:
        working-directory: python  # Python project lives under python/ (polyglot monorepo)

    steps:
      - name: Validate release inputs
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_TO_PROD: ${{ inputs.release_to_prod }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        working-directory: .
        run: |
          set -euo pipefail
          # Test PyPI stays permissive (dev/rc suffixes, re-tries); the strict
          # gates below apply to production only.
          if [[ "$RELEASE_TO_PROD" != "true" ]]; then
            exit 0
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be X.Y.Z, got: $VERSION" >&2
            exit 1
          fi
          if [[ "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Production releases must be dispatched from $DEFAULT_BRANCH, got: $REF_NAME" >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tags

      - name: Resolve previous component tag
        # Must run BEFORE the target tag is created, otherwise git describe
        # would find the tag being released and produce an empty range.
        if: ${{ inputs.release_to_prod }}
        id: tags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TARGET_TAG="bnbagent-v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TARGET_TAG" >/dev/null; then
            echo "Refusing to release: tag $TARGET_TAG already exists" >&2
            exit 1
          fi
          PREVIOUS_TAG="$(git describe --tags --match 'bnbagent-v[0-9]*' --abbrev=0 2>/dev/null || true)"
          echo "target_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: ${{ inputs.release_to_prod }}
        env:
          VERSION: ${{ inputs.version }}
          TARGET_TAG: ${{ steps.tags.outputs.target_tag }}
          PREVIOUS_TAG: ${{ steps.tags.outputs.previous_tag }}
        working-directory: .
        run: |
          set -euo pipefail
          if [[ -n "$PREVIOUS_TAG" ]]; then
            RANGE="$PREVIOUS_TAG..HEAD"
          else
            RANGE="HEAD"
          fi
          # Scope to this component: python/ plus the shared repo-root abis/
          # (vendored into the wheel/sdist by hatch_build.py). :(top) anchors
          # the pathspecs to the repo root regardless of the working directory.
          CHANGES="$(git log --no-merges --pretty='format:- %s (%h)' "$RANGE" \
            -- ':(top)python/' ':(top)abis/')"
          {
            echo "## bnbagent v$VERSION"
            echo
            echo "Python SDK for ERC-8004 on-chain agent registration and management."
            echo
            echo "### Installation"
            echo
            echo '```bash'
            echo "pip install bnbagent==$VERSION"
            echo '```'
            echo
            echo "### What's Changed"
            echo
            if [[ -n "$CHANGES" ]]; then
              echo "$CHANGES"
            else
              echo "_No notable changes._"
            fi
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...$TARGET_TAG"
            fi
          } > RELEASE_NOTES.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Run tests
        if: ${{ !inputs.skip_tests }}
        run: |
          uv run pytest -v

      - name: Update version in _version.py
        run: |
          sed -i 's/^__version__ = ".*"/__version__ = "${{ inputs.version }}"/' bnbagent/_version.py
          echo "Updated version to ${{ inputs.version }}"
          grep "^__version__" bnbagent/_version.py

      - name: Build package
        run: |
          uv build

      - name: Check package contents
        run: |
          ls -lh dist/
          echo "Package files:"
          find dist -type f

      - name: Check whether the version is already on PyPI
        # Recovery path: if a previous run published to PyPI but failed before
        # the tag/Release, skip the duplicate upload and repair the rest.
        if: ${{ inputs.release_to_prod }}
        id: pypi
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/bnbagent/$VERSION/json")"
          if [[ "$STATUS" == "200" ]]; then
            echo "bnbagent $VERSION is already on PyPI; skipping upload"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Production PyPI
        if: ${{ inputs.release_to_prod && steps.pypi.outputs.exists != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./python/dist/
          print-hash: true
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Uses trusted publishing (OIDC) - no token needed
          # Configure OIDC in PyPI account settings: https://pypi.org/manage/account/publishing/

      - name: Publish to Test PyPI
        if: ${{ !inputs.release_to_prod }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./python/dist/
          print-hash: true
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          # For Test PyPI, you can use trusted publishing or API token
          # If using API token, set TEST_PYPI_API_TOKEN secret

      - name: Commit version update through the GitHub API
        if: success() && inputs.release_to_prod
        id: version_commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet HEAD -- bnbagent/_version.py; then
            echo "Version file already up to date; nothing to commit"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # GitHub signs this commit; no bot GPG private key is needed.
          COMMIT_REQUEST="$(mktemp)"
          trap 'rm -f "$COMMIT_REQUEST"' EXIT
          python - <<'PYTHON' > "$COMMIT_REQUEST"
          import base64
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          mutation = """
          mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit { oid signature { isValid wasSignedByGitHub } }
            }
          }
          """
          payload = {
              "branch": {
                  "repositoryNameWithOwner": os.environ["GITHUB_REPOSITORY"],
                  "branchName": os.environ["GITHUB_REF_NAME"],
              },
              "expectedHeadOid": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "message": {"headline": f'chore: bump version to {os.environ["VERSION"]}'},
              "fileChanges": {
                  "additions": [{
                      "path": "python/bnbagent/_version.py",
                      "contents": base64.b64encode(Path("bnbagent/_version.py").read_bytes()).decode(),
                  }],
              },
          }
          json.dump({"query": mutation, "variables": {"input": payload}}, sys.stdout)
          PYTHON
          COMMIT_RESPONSE="$(gh api graphql --input "$COMMIT_REQUEST")"
          if ! VERSION_COMMIT_SHA="$(jq -er '
            .data.createCommitOnBranch.commit
            | select(.signature.isValid == true and .signature.wasSignedByGitHub == true)
            | .oid | select(test("^[0-9a-f]{40}$"))
          ' <<< "$COMMIT_RESPONSE")"; then
            echo "GitHub did not return a verified version commit; refusing to tag" >&2
            exit 1
          fi
          echo "commit_sha=$VERSION_COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        if: success() && inputs.release_to_prod
        env:
          TARGET_TAG: ${{ steps.tags.outputs.target_tag }}
          RELEASE_SHA: ${{ steps.version_commit.outputs.commit_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The API updates the remote branch, while local HEAD stays at checkout.
          git fetch --no-tags origin "$RELEASE_SHA"
          git tag -a "$TARGET_TAG" -m "Release bnbagent v${{ inputs.version }}" "$RELEASE_SHA"
          git push origin "$TARGET_TAG"

      - name: Create GitHub Release
        if: success() && inputs.release_to_prod
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tags.outputs.target_tag }}
          name: bnbagent v${{ inputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          make_latest: true
