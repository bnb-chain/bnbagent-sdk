name: Python SDK CI

# Scoped to the Python package: changes under typescript/ or docs/ do not trigger
# this workflow. The shared repo-root abis/ is included because the Python SDK
# loads those ABIs at runtime and vendors them at build time
# (see bnbagent/core/abis.py + hatch_build.py).
on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "abis/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "python/**"
      - "abis/**"
      - ".github/workflows/python-ci.yml"

defaults:
  run:
    working-directory: python

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Run unit tests
        run: uv run pytest

  twak-cli:
    # TwakX402Payer against the real twak CLI, fully offline: the test preloads
    # tests/fixtures/twak_x402/intercept_fetch.cjs into the CLI, which serves
    # the x402 endpoint in-process and blocks every other host. Pinned to the
    # release line in TWAK_X402_VERIFIED_CLI (keep the two in sync);
    # twak-cli-latest.yml covers newer releases.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --extra dev --python 3.12

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install the verified twak CLI
        run: npm install --no-save --prefix "$RUNNER_TEMP/twak" @trustwallet/cli@0.20.0

      - name: Real-CLI x402 tests
        env:
          TWAK_CLI_BIN: ${{ runner.temp }}/twak/node_modules/.bin/twak
        run: uv run pytest tests/test_twak_real_cli.py
