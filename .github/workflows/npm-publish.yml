name: Publish (npm)
run-name: Publish @bnbagent/sdk (${{ inputs.release_type }})

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release channel"
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - production
      source_ref:
        description: "Alpha source branch or commit SHA (ignored for production)"
        required: false
        type: string
      target_version:
        description: "Alpha target stable version (X.Y.Z)"
        required: true
        default: "0.6.1"
        type: string
      existing_version:
        description: "Existing alpha version to verify without republishing (optional)"
        required: false
        type: string
      bump:
        description: "Production version selection (current reuses the package version)"
        required: true
        default: current
        type: choice
        options:
          - current
          - patch
          - minor
          - major

permissions:
  actions: read
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate protected dispatch
    runs-on: ubuntu-latest
    steps:
      - name: Require the default-branch workflow
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Run this workflow from the protected default branch: $DEFAULT_BRANCH" >&2
            exit 1
          fi
          if [[ "$RELEASE_TYPE" == "alpha" && -z "$SOURCE_REF" ]]; then
            echo "source_ref is required for an alpha release" >&2
            exit 1
          fi

  resolve:
    name: Resolve source, version, and CI evidence
    if: inputs.release_type == 'alpha'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      alpha_version: ${{ steps.version.outputs.alpha_version }}
      ci_run_url: ${{ steps.ci.outputs.ci_run_url }}
      reuse_ci: ${{ steps.ci.outputs.reuse_ci }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout alpha source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source_ref belongs to a repository branch
        # fetch-depth: 0 already fetched every branch into refs/remotes/origin;
        # a later git fetch would have no credentials (persist-credentials: false).
        run: |
          set -euo pipefail
          if [[ -z "$(git for-each-ref --count=1 refs/remotes/origin/)" ]]; then
            echo "Checkout did not fetch any repository branches" >&2
            exit 1
          fi
          SOURCE_SHA="$(git rev-parse --verify HEAD)"
          if [[ -z "$(git branch -r --contains "$SOURCE_SHA" 'origin/*')" ]]; then
            echo "Refusing alpha release: $SOURCE_SHA is not reachable from any branch of $GITHUB_REPOSITORY" >&2
            exit 1
          fi

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve the next alpha version
        id: version
        env:
          EXISTING_VERSION: ${{ inputs.existing_version }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "target_version must be X.Y.Z, got: $TARGET_VERSION" >&2
            exit 1
          fi

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          if [[ "$PACKAGE_NAME" != "@bnbagent/sdk" ]]; then
            echo "Refusing to publish unexpected package: $PACKAGE_NAME" >&2
            exit 1
          fi

          STABLE_VERSION="$(npm view "$PACKAGE_NAME@$TARGET_VERSION" version 2>/dev/null || true)"
          if [[ "$STABLE_VERSION" == "$TARGET_VERSION" ]]; then
            echo "Refusing to publish an alpha after stable $TARGET_VERSION" >&2
            exit 1
          fi

          SOURCE_SHA="$(git rev-parse HEAD)"
          ALPHA_VERSION="$(
            node <<'NODE'
          const { execFileSync } = require("node:child_process");

          const packageName = "@bnbagent/sdk";
          const target = process.env.TARGET_VERSION;
          const existing = process.env.EXISTING_VERSION;

          function versions() {
            try {
              const output = execFileSync(
                "npm",
                ["view", packageName, "versions", "--json"],
                {
                  encoding: "utf8",
                  stdio: ["ignore", "pipe", "pipe"],
                },
              );
              const parsed = JSON.parse(output || "[]");
              return Array.isArray(parsed)
                ? parsed
                : typeof parsed === "string"
                  ? [parsed]
                  : [];
            } catch (error) {
              const stderr = String(error.stderr || "");
              if (stderr.includes("E404")) return [];
              throw error;
            }
          }

          function alphaTag() {
            try {
              const output = execFileSync("npm", ["dist-tag", "ls", packageName], {
                encoding: "utf8",
                stdio: ["ignore", "pipe", "pipe"],
              });
              return output.match(/^alpha:\s+(\S+)$/m)?.[1];
            } catch (error) {
              const stderr = String(error.stderr || "");
              if (stderr.includes("E404")) return undefined;
              throw error;
            }
          }

          const published = new Set(versions());
          const tagged = alphaTag();
          if (tagged) published.add(tagged);

          if (existing) {
            const pattern = new RegExp(`^${target.replace(/\./g, "\\.")}-alpha\\.[0-9]+$`);
            if (!pattern.test(existing)) {
              throw new Error(`existing_version must match ${target}-alpha.N`);
            }
            if (!published.has(existing)) {
              throw new Error(`existing_version is not published: ${existing}`);
            }
            process.stdout.write(existing);
            process.exit(0);
          }

          const prefix = `${target}-alpha.`;
          const numbers = [...published]
            .filter((version) => version.startsWith(prefix))
            .map((version) => version.slice(prefix.length))
            .filter((suffix) => /^\d+$/.test(suffix))
            .map(Number);
          process.stdout.write(`${prefix}${Math.max(0, ...numbers) + 1}`);
          NODE
          )"

          echo "alpha_version=$ALPHA_VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Reuse trusted CI for the exact source commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
          TRUSTED_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          echo "reuse_ci=false" >> "$GITHUB_OUTPUT"
          echo "ci_run_url=" >> "$GITHUB_OUTPUT"

          if ! RUNS="$(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/typescript-ci.yml/runs" \
              -f head_sha="$SOURCE_SHA" \
              -f status=success \
              -f per_page=10
          )"; then
            echo "::warning::Could not read CI evidence; running fresh verification"
            exit 0
          fi

          while read -r RUN_ID; do
            [[ -n "$RUN_ID" ]] || continue
            if ! JOBS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs")"; then
              continue
            fi
            if jq -e '
              def passed($steps; $name):
                any($steps[]?; .name == $name and .conclusion == "success");
              any(
                .jobs[];
                .name == "check"
                  and .conclusion == "success"
                  and (
                    .steps as $steps
                    | passed($steps; "Regenerate ABIs and verify no drift")
                      and passed($steps; "Typecheck (src)")
                      and passed($steps; "Typecheck (examples)")
                      and passed($steps; "Lint")
                      and passed($steps; "Test")
                      and passed($steps; "Build")
                      and passed($steps; "Offline examples (self-contained, no network)")
                  )
              )
            ' <<<"$JOBS" >/dev/null; then
              echo "reuse_ci=true" >> "$GITHUB_OUTPUT"
              echo "ci_run_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
                >> "$GITHUB_OUTPUT"
              echo "Reusing successful CI run $RUN_ID for $SOURCE_SHA"
              exit 0
            fi
          done < <(
            jq -r \
              --arg branch "$TRUSTED_BRANCH" \
              --arg sha "$SOURCE_SHA" \
              '
                .workflow_runs[]
                | select(
                    .event == "push"
                    and .head_branch == $branch
                    and .head_sha == $sha
                    and .path == ".github/workflows/typescript-ci.yml"
                  )
                | .id
              ' <<<"$RUNS"
          )

          echo "No reusable trusted-branch CI run found for $SOURCE_SHA; running fresh verification"

  verify:
    name: Verify source (${{ matrix.check }})
    if: inputs.release_type == 'alpha' && needs.resolve.outputs.reuse_ci != 'true'
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - static
          - tests
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout the resolved source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: typescript/package.json

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification slice
        env:
          CHECK: ${{ matrix.check }}
        run: |
          set -euo pipefail
          case "$CHECK" in
            static)
              pnpm run codegen
              git diff --exit-code src/abis

              PIDS=()
              pnpm run typecheck &
              PIDS+=("$!")
              pnpm run typecheck:examples &
              PIDS+=("$!")
              pnpm run lint &
              PIDS+=("$!")

              FAILED=0
              for PID in "${PIDS[@]}"; do
                if ! wait "$PID"; then
                  FAILED=1
                fi
              done
              if [[ "$FAILED" -ne 0 ]]; then
                exit 1
              fi
              git diff --check
              ;;
            tests)
              pnpm run test
              ;;
            *)
              echo "Unknown verification slice: $CHECK" >&2
              exit 1
              ;;
          esac

  package:
    name: Build and verify the alpha tarball
    if: inputs.release_type == 'alpha'
    needs: resolve
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout the resolved source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: typescript/package.json

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply alpha package metadata and build once
        env:
          ALPHA_VERSION: ${{ needs.resolve.outputs.alpha_version }}
        run: |
          # Align package metadata with the workflow identity before building.
          npm pkg set "version=$ALPHA_VERSION" \
            "repository.url=https://github.com/$GITHUB_REPOSITORY.git"
          npm pkg delete publishConfig
          pnpm run build
          git diff --check

      - name: Run offline examples
        run: |
          set -euo pipefail
          pnpm run example:x402 &
          X402_PID="$!"
          pnpm run example:security &
          SECURITY_PID="$!"

          FAILED=0
          for PID in "$X402_PID" "$SECURITY_PID"; do
            if ! wait "$PID"; then
              FAILED=1
            fi
          done
          exit "$FAILED"

      - name: Pack and verify the installable tarball
        env:
          ALPHA_VERSION: ${{ needs.resolve.outputs.alpha_version }}
        run: |
          set -euo pipefail
          PACK_DIR="$RUNNER_TEMP/npm-pack"
          CONSUMER_DIR="$(mktemp -d)"
          mkdir -p "$PACK_DIR"
          npm pack --ignore-scripts --json --pack-destination "$PACK_DIR" >/dev/null
          mapfile -t TARBALLS < <(find "$PACK_DIR" -maxdepth 1 -type f -name '*.tgz')
          if [[ "${#TARBALLS[@]}" -ne 1 ]]; then
            echo "Expected exactly one tarball, found ${#TARBALLS[@]}" >&2
            exit 1
          fi
          TARBALL_PATH="$PACK_DIR/bnbagent-sdk-$ALPHA_VERSION.tgz"
          if [[ "${TARBALLS[0]}" != "$TARBALL_PATH" ]]; then
            echo "Unexpected tarball filename: ${TARBALLS[0]}" >&2
            exit 1
          fi
          CLEAN_DIR="$RUNNER_TEMP/npm-clean"
          CLEAN_TARBALL="$CLEAN_DIR/bnbagent-sdk-$ALPHA_VERSION.tgz"
          mkdir -p "$CLEAN_DIR"
          pnpm exec tsx scripts/release.ts verify-tarball \
            "$TARBALL_PATH" \
            "$ALPHA_VERSION" \
            "https://github.com/$GITHUB_REPOSITORY.git" \
            --repack "$CLEAN_TARBALL"

          cd "$CONSUMER_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$CLEAN_TARBALL"
          node --input-type=module -e \
            "await import('@bnbagent/sdk'); const { getBuiltWithValue } = await import('@bnbagent/sdk/erc8004'); const expected = 'https://github.com/bnb-chain/bnbagent-sdk#v' + process.env.ALPHA_VERSION; if (getBuiltWithValue() !== expected) throw new Error('unexpected built_with version')"
          node -e \
            "require('@bnbagent/sdk'); require('@bnbagent/sdk/erc8004')"

      - name: Upload verified tarball
        uses: actions/upload-artifact@v4
        with:
          name: bnbagent-sdk-${{ needs.resolve.outputs.alpha_version }}
          path: ${{ runner.temp }}/npm-clean/*.tgz
          if-no-files-found: error
          retention-days: 7

  alpha-publish:
    name: Publish alpha to npm
    if: >-
      always() &&
      inputs.release_type == 'alpha' &&
      needs.resolve.result == 'success' &&
      needs.package.result == 'success' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    needs:
      - resolve
      - verify
      - package
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified tarball
        uses: actions/download-artifact@v4
        with:
          name: bnbagent-sdk-${{ needs.resolve.outputs.alpha_version }}
          path: package

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Install OIDC-capable npm
        run: npm install --global npm@11.15.0

      - name: Verify artifact identity and repack clean archive
        id: artifact
        env:
          ALPHA_VERSION: ${{ needs.resolve.outputs.alpha_version }}
        run: |
          set -euo pipefail
          # Absolute path: npm parses a bare "package/x.tgz" argument as a
          # GitHub owner/repo shorthand, not a file.
          mapfile -t TARBALLS < <(find "$PWD/package" -maxdepth 1 -type f -name '*.tgz')
          if [[ "${#TARBALLS[@]}" -ne 1 ]]; then
            echo "Expected exactly one tarball, found ${#TARBALLS[@]}" >&2
            exit 1
          fi
          RAW_TARBALL="$PWD/package/bnbagent-sdk-$ALPHA_VERSION.tgz"
          if [[ "${TARBALLS[0]}" != "$RAW_TARBALL" ]]; then
            echo "Unexpected tarball filename: ${TARBALLS[0]}" >&2
            exit 1
          fi
          CLEAN_TARBALL="$RUNNER_TEMP/bnbagent-sdk-$ALPHA_VERSION.clean.tgz"
          INTEGRITY="$(
            RAW_TARBALL="$RAW_TARBALL" \
            CLEAN_TARBALL="$CLEAN_TARBALL" \
            EXPECTED_VERSION="$ALPHA_VERSION" \
            EXPECTED_REPO="https://github.com/$GITHUB_REPOSITORY.git" \
            node <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync, writeFileSync } = require("node:fs");
          const posix = require("node:path/posix");
          const { gunzipSync, gzipSync } = require("node:zlib");

          const rawBuf = gunzipSync(readFileSync(process.env.RAW_TARBALL));
          if (rawBuf.length === 0 || rawBuf.length % 512 !== 0) {
            throw new Error(`Invalid tar length: ${rawBuf.length}`);
          }
          const readAscii = (b) => {
            const z = b.indexOf(0);
            return (z >= 0 ? b.subarray(0, z) : b).toString("utf8");
          };
          const parseOctal = (b, f) => {
            const s = readAscii(b).trim();
            if (!s) return 0;
            if (!/^[0-7]+$/.test(s)) throw new Error(`Bad octal ${f}: ${s}`);
            return Number.parseInt(s, 8);
          };
          const isZero = (b) => b.every((x) => x === 0);
          const encodeHeader = (name, mode, size) => {
            const nb = Buffer.from(name, "utf8");
            if (nb.length === 0 || nb.length > 100) throw new Error(`Path length: ${name}`);
            const h = Buffer.alloc(512, 0);
            nb.copy(h, 0);
            h.write(`${(mode & 0o7777).toString(8).padStart(7, "0")}\0`, 100, "ascii");
            h.write("0000000\0", 108, "ascii");
            h.write("0000000\0", 116, "ascii");
            h.write(`${size.toString(8).padStart(11, "0")}\0`, 124, "ascii");
            h.write("00000000000\0", 136, "ascii");
            h.write("0", 156, "ascii");
            h.write("ustar\0", 257, "ascii");
            h.write("00", 263, "ascii");
            h.fill(0x20, 148, 156);
            let sum = 0;
            for (let i = 0; i < 512; i++) sum += h[i];
            h.write(`${sum.toString(8).padStart(6, "0")}\0 `, 148, "ascii");
            return h;
          };

          const seen = new Set();
          const files = [];
          let manifest = null;
          let off = 0;
          let eof = false;
          while (off < rawBuf.length) {
            const hdr = rawBuf.subarray(off, off + 512);
            if (isZero(hdr)) {
              eof = true;
              off += 512;
              continue;
            }
            if (eof) throw new Error("Trailing non-zero block after EOF");
            const storedSum = parseOctal(hdr.subarray(148, 156), "checksum");
            let calcSum = 0;
            for (let i = 0; i < 512; i++) calcSum += i >= 148 && i < 156 ? 0x20 : hdr[i];
            if (storedSum !== calcSum) throw new Error("Header checksum mismatch");

            const tb = hdr[156];
            const tf = tb === 0 ? "\0" : String.fromCharCode(tb);
            if (tf !== "0" && tf !== "\0" && tf !== "5") {
              throw new Error(`Disallowed tar typeflag: ${JSON.stringify(tf)}`);
            }
            if (hdr.subarray(257, 265).toString("latin1") !== "ustar\u000000") {
              throw new Error("Tar entry header is not POSIX ustar");
            }
            if (!isZero(hdr.subarray(345, 500))) {
              throw new Error("Tar entry uses the ustar prefix field");
            }
            const rawPath = readAscii(hdr.subarray(0, 100));
            if (!rawPath || rawPath.startsWith("/") || rawPath.split("/").some((s) => s === ".." || s === ".")) {
              throw new Error(`Unsafe tar path: ${rawPath}`);
            }
            const norm = posix.normalize(rawPath).replace(/\/+$/, "");
            if (norm !== "package" && !norm.startsWith("package/")) {
              throw new Error(`Unexpected root in tar path: ${norm}`);
            }
            const size = parseOctal(hdr.subarray(124, 136), "size");
            const mode = parseOctal(hdr.subarray(100, 108), "mode") || 0o644;
            if (tf === "5" && size !== 0) throw new Error("Non-zero directory size");
            const dataStart = off + 512;
            const paddedEnd = dataStart + Math.ceil(size / 512) * 512;
            if (paddedEnd > rawBuf.length) throw new Error("Truncated tar entry");
            if (seen.has(norm)) throw new Error(`Duplicate tar entry: ${norm}`);
            seen.add(norm);
            if (tf !== "5") {
              const data = Buffer.from(rawBuf.subarray(dataStart, dataStart + size));
              if (norm === "package/package.json") {
                manifest = JSON.parse(data.toString("utf8"));
              }
              files.push({ path: norm, mode, data });
            }
            off = paddedEnd;
          }

          if (!manifest || typeof manifest !== "object") throw new Error("Missing package/package.json");
          if (manifest.name !== "@bnbagent/sdk") throw new Error(`Unexpected name: ${manifest.name}`);
          if (manifest.version !== process.env.EXPECTED_VERSION) {
            throw new Error(`Unexpected version: ${manifest.version}`);
          }
          if (manifest.repository?.url !== process.env.EXPECTED_REPO) {
            throw new Error(`Unexpected repository.url: ${manifest.repository?.url}`);
          }
          if (Object.hasOwn(manifest, "publishConfig")) {
            throw new Error("Tarball package.json must not contain publishConfig");
          }
          const cleanManifest = { ...manifest };
          delete cleanManifest.publishConfig;
          delete cleanManifest.scripts;
          const cleanManifestBuf = Buffer.from(`${JSON.stringify(cleanManifest, null, 2)}\n`, "utf8");
          const outChunks = [];
          for (const f of files) {
            const d = f.path === "package/package.json" ? cleanManifestBuf : f.data;
            outChunks.push(encodeHeader(f.path, f.mode, d.length), d);
            const pad = (512 - (d.length % 512)) % 512;
            if (pad) outChunks.push(Buffer.alloc(pad, 0));
          }
          outChunks.push(Buffer.alloc(1024, 0));
          const cleanTgz = gzipSync(Buffer.concat(outChunks));
          writeFileSync(process.env.CLEAN_TARBALL, cleanTgz);
          process.stdout.write(`sha512-${createHash("sha512").update(cleanTgz).digest("base64")}`);
          NODE
          )"
          echo "tarball=$CLEAN_TARBALL" >> "$GITHUB_OUTPUT"
          echo "integrity=$INTEGRITY" >> "$GITHUB_OUTPUT"

      - name: Read registry state
        id: registry
        env:
          ALPHA_VERSION: ${{ needs.resolve.outputs.alpha_version }}
        run: |
          set -euo pipefail
          TAGS="$(npm dist-tag ls "@bnbagent/sdk" --registry=https://registry.npmjs.org 2>/dev/null || true)"
          ALPHA_TAG="$(awk '$1 == "alpha:" { print $2 }' <<<"$TAGS")"
          LATEST_TAG="$(awk '$1 == "latest:" { print $2 }' <<<"$TAGS")"

          if [[ "$ALPHA_TAG" == "$ALPHA_VERSION" ]]; then
            EXISTS=true
          else
            EXACT="$(
              npm view "@bnbagent/sdk@$ALPHA_VERSION" version --registry=https://registry.npmjs.org --prefer-online 2>/dev/null || true
            )"
            if [[ "$EXACT" == "$ALPHA_VERSION" ]]; then
              EXISTS=true
            else
              EXISTS=false
            fi
          fi

          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Publish under the alpha dist-tag
        if: steps.registry.outputs.exists != 'true'
        env:
          # workflow_dispatch runs from main while source_ref may be another
          # commit, so alpha provenance would identify the dispatcher commit.
          NPM_CONFIG_PROVENANCE: "false"
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        # Step env keys are case-insensitive, so lowercase proxy variables can
        # only be cleared from the shell.
        run: >-
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY
          -u http_proxy -u https_proxy -u all_proxy
          -u NPM_CONFIG_PROXY -u NPM_CONFIG_HTTPS_PROXY
          -u npm_config_proxy -u npm_config_https_proxy
          npm publish "$TARBALL"
          --access public
          --tag alpha
          --ignore-scripts
          --registry=https://registry.npmjs.org
          --strict-ssl=true
          --json

      - name: Check prerelease dist-tags
        env:
          ALPHA_VERSION: ${{ needs.resolve.outputs.alpha_version }}
          TARGET_VERSION: ${{ inputs.target_version }}
          EXPECTED_INTEGRITY: ${{ steps.artifact.outputs.integrity }}
          PREVIOUS_LATEST: ${{ steps.registry.outputs.latest }}
        run: |
          set -euo pipefail
          TAGS="$(npm dist-tag ls "@bnbagent/sdk" --registry=https://registry.npmjs.org 2>/dev/null || true)"
          ALPHA_TAG="$(awk '$1 == "alpha:" { print $2 }' <<<"$TAGS")"
          LATEST_TAG="$(awk '$1 == "latest:" { print $2 }' <<<"$TAGS")"

          if [[ "$ALPHA_TAG" != "$ALPHA_VERSION" ]]; then
            echo "::warning::npm accepted the publish, but the public alpha tag is still propagating"
          fi
          if [[ "$LATEST_TAG" == "$ALPHA_VERSION" ]]; then
            echo "Refusing to leave an alpha version under latest" >&2
            exit 1
          fi
          if [[ -n "$PREVIOUS_LATEST" && "$LATEST_TAG" != "$PREVIOUS_LATEST" ]]; then
            echo "latest changed from $PREVIOUS_LATEST to $LATEST_TAG" >&2
            exit 1
          fi
          STABLE_CHECK="$(npm view "@bnbagent/sdk@$TARGET_VERSION" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
          if [[ "$STABLE_CHECK" == "$TARGET_VERSION" ]]; then
            echo "Refusing alpha run: stable version $TARGET_VERSION appeared on npm" >&2
            exit 1
          fi
          REMOTE_INTEGRITY="$(npm view "@bnbagent/sdk@$ALPHA_VERSION" dist.integrity --registry=https://registry.npmjs.org 2>/dev/null || true)"
          if [[ -n "$REMOTE_INTEGRITY" && "$REMOTE_INTEGRITY" != "$EXPECTED_INTEGRITY" ]]; then
            echo "Published integrity $REMOTE_INTEGRITY does not match expected $EXPECTED_INTEGRITY" >&2
            exit 1
          fi

      - name: Check public metadata without blocking publication
        env:
          ALPHA_VERSION: ${{ needs.resolve.outputs.alpha_version }}
        run: |
          EXACT="$(
            npm view "@bnbagent/sdk@$ALPHA_VERSION" version 2>/dev/null || true
          )"
          if [[ "$EXACT" != "$ALPHA_VERSION" ]]; then
            echo "::warning::@bnbagent/sdk@$ALPHA_VERSION is published but public metadata is still propagating"
          fi

      - name: Write install summary
        env:
          ALPHA_VERSION: ${{ needs.resolve.outputs.alpha_version }}
          CI_RUN_URL: ${{ needs.resolve.outputs.ci_run_url }}
          REUSE_CI: ${{ needs.resolve.outputs.reuse_ci }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          {
            echo "## @bnbagent/sdk alpha package"
            echo
            echo "- Version: \`$ALPHA_VERSION\`"
            echo "- Source commit: \`$SOURCE_SHA\`"
            if [[ "$REUSE_CI" == "true" ]]; then
              echo "- Verification: reused [successful CI]($CI_RUN_URL) for the exact source commit"
            else
              echo "- Verification: fresh parallel checks in this workflow"
            fi
            echo "- Dist-tag: \`alpha\`"
            echo "- Provenance: disabled because source_ref may differ from the dispatcher commit"
            echo
            echo '```bash'
            echo "pnpm add -E @bnbagent/sdk@$ALPHA_VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Publish production to npm
    if: inputs.release_type == 'production'
    needs: validate
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: typescript/package.json

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install OIDC-capable npm
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify ABIs are in sync
        run: |
          pnpm run codegen
          git diff --exit-code src/abis

      - name: Prepare or resume version
        id: version
        run: pnpm exec tsx scripts/release.ts prepare "${{ inputs.bump }}" >> "$GITHUB_OUTPUT"

      - name: Check source and build
        run: |
          pnpm run typecheck
          pnpm run typecheck:examples
          pnpm run lint
          pnpm run test
          pnpm run build
          git diff --check

      - name: Generate release notes
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          pnpm exec tsx scripts/release.ts changelog > RELEASE_NOTES.md
          {
            echo
            echo "### Installation"
            echo
            echo '```bash'
            echo "pnpm add -E @bnbagent/sdk@$V"
            echo '```'
          } >> RELEASE_NOTES.md

      - name: Commit version bump through the GitHub API
        id: commit
        if: steps.version.outputs.commit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: pnpm exec tsx scripts/release.ts commit "$V" >> "$GITHUB_OUTPUT"

      - name: Freeze workspace dependencies for publishing
        run: pnpm exec tsx scripts/release.ts freeze

      - name: Align package metadata with the publishing repository
        # Apply metadata after the version commit, to the package being published.
        run: |
          npm pkg set "repository.url=https://github.com/$GITHUB_REPOSITORY.git"
          npm pkg delete publishConfig

      - name: Pack and verify the installable tarball
        id: pack
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PACK_DIR="$RUNNER_TEMP/npm-pack"
          CONSUMER_DIR="$(mktemp -d)"
          mkdir -p "$PACK_DIR"
          npm pack --ignore-scripts --json --pack-destination "$PACK_DIR" >/dev/null
          mapfile -t TARBALLS < <(find "$PACK_DIR" -maxdepth 1 -type f -name '*.tgz')
          if [[ "${#TARBALLS[@]}" -ne 1 ]]; then
            echo "Expected exactly one tarball, found ${#TARBALLS[@]}" >&2
            exit 1
          fi
          TARBALL_PATH="$PACK_DIR/bnbagent-sdk-$V.tgz"
          if [[ "${TARBALLS[0]}" != "$TARBALL_PATH" ]]; then
            echo "Unexpected tarball filename: ${TARBALLS[0]}" >&2
            exit 1
          fi
          # Publish the archive re-encoded from the verified entries, never the
          # raw npm pack output.
          CLEAN_TARBALL="$RUNNER_TEMP/bnbagent-sdk-$V.clean.tgz"
          pnpm exec tsx scripts/release.ts verify-tarball \
            "$TARBALL_PATH" \
            "$V" \
            "https://github.com/$GITHUB_REPOSITORY.git" \
            --repack "$CLEAN_TARBALL"
          pnpm exec tsx scripts/release.ts verify-tarball \
            "$CLEAN_TARBALL" \
            "$V" \
            "https://github.com/$GITHUB_REPOSITORY.git"

          cd "$CONSUMER_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$CLEAN_TARBALL"
          node --input-type=module -e \
            "await import('@bnbagent/sdk'); const { getBuiltWithValue } = await import('@bnbagent/sdk/erc8004'); const expected = 'https://github.com/bnb-chain/bnbagent-sdk#v' + process.env.V; if (getBuiltWithValue() !== expected) throw new Error('unexpected built_with version')"
          node -e \
            "require('@bnbagent/sdk'); require('@bnbagent/sdk/erc8004')"
          echo "tarball=$CLEAN_TARBALL" >> "$GITHUB_OUTPUT"

      - name: Publish stable package with provenance
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        # Step env keys are case-insensitive, so lowercase proxy variables can
        # only be cleared from the shell.
        run: >-
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY
          -u http_proxy -u https_proxy -u all_proxy
          -u NPM_CONFIG_PROXY -u NPM_CONFIG_HTTPS_PROXY
          -u npm_config_proxy -u npm_config_https_proxy
          pnpm exec tsx scripts/release.ts publish --tag latest --tarball "$TARBALL"

      - name: Create Git tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        # Tag carries the full npm coordinate so it cannot collide with the
        # Python component's bnbagent-vX.Y.Z line. Both components explicitly
        # mark their newest stable as Latest (most-recent-stable policy).
        # The tag ref is created first because gh release create ignores
        # --target when the tag already exists; creating the ref fails if it does.
        run: |
          set -euo pipefail
          RELEASE_SHA="${COMMIT_SHA:-$(git rev-parse HEAD)}"
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unexpected release commit: $RELEASE_SHA" >&2
            exit 1
          fi
          TAG="@bnbagent/sdk@v$V"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" \
            -f "sha=$RELEASE_SHA" >/dev/null
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "@bnbagent/sdk v$V" \
            --notes-file RELEASE_NOTES.md \
            --latest

      - name: Write release summary
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## @bnbagent/sdk production package"
            echo
            echo "- Version: \`$V\`"
            echo "- Dist-tag: \`latest\`"
            echo "- GitHub Release: \`@bnbagent/sdk@v$V\`"
            echo "- Provenance: enabled by npm trusted publishing"
          } >> "$GITHUB_STEP_SUMMARY"
