name: Publish (npm)
run-name: Publish @bnbagent/sdk (${{ inputs.release_type }})

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release channel"
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - production
      source_ref:
        description: "Alpha source branch or commit SHA (ignored for production)"
        required: false
        type: string
      target_version:
        description: "Alpha target stable version (X.Y.Z)"
        required: true
        default: "0.6.1"
        type: string
      existing_version:
        description: "Existing alpha version to verify without republishing (optional)"
        required: false
        type: string
      bump:
        description: "Production version selection (current reuses the package version)"
        required: true
        default: current
        type: choice
        options:
          - current
          - patch
          - minor
          - major

permissions:
  actions: read
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate protected dispatch
    runs-on: ubuntu-latest
    steps:
      - name: Authorize release actors
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ACTOR_ID: ${{ github.actor_id }}
          RELEASE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          # Immutable GitHub IDs: jardenx, aiden-cao, robot-ux.
          allowed_release_actor() {
            case "$1" in
              274764117|104969608|81206731) return 0 ;;
              *) return 1 ;;
            esac
          }
          if ! allowed_release_actor "$RELEASE_ACTOR_ID"; then
            echo "Release initiator is not an approved publisher" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TRIGGERING_ACTOR" =~ ^[A-Za-z0-9][A-Za-z0-9-]*$ ]]; then
            echo "Invalid triggering actor" >&2
            exit 1
          fi
          TRIGGERING_ID="$(gh api --method GET "users/$RELEASE_TRIGGERING_ACTOR" --jq '.id')"
          if ! allowed_release_actor "$TRIGGERING_ID"; then
            echo "Release rerunner is not an approved publisher" >&2
            exit 1
          fi

      - name: Require the default-branch workflow
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ "$REF_NAME" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Run this workflow from the protected default branch: $DEFAULT_BRANCH" >&2
            exit 1
          fi
          if [[ "$RELEASE_TYPE" == "alpha" && -z "$SOURCE_REF" ]]; then
            echo "source_ref is required for an alpha release" >&2
            exit 1
          fi

  resolve:
    name: Resolve source, version, and CI evidence
    if: inputs.release_type == 'alpha'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      alpha_version: ${{ steps.version.outputs.alpha_version }}
      ci_run_url: ${{ steps.ci.outputs.ci_run_url }}
      reuse_ci: ${{ steps.ci.outputs.reuse_ci }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout alpha source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source_ref belongs to a repository branch
        # fetch-depth: 0 already fetched every branch into refs/remotes/origin;
        # a later git fetch would have no credentials (persist-credentials: false).
        run: |
          set -euo pipefail
          if [[ -z "$(git for-each-ref --count=1 refs/remotes/origin/)" ]]; then
            echo "Checkout did not fetch any repository branches" >&2
            exit 1
          fi
          SOURCE_SHA="$(git rev-parse --verify HEAD)"
          if [[ -z "$(git branch -r --contains "$SOURCE_SHA" 'origin/*')" ]]; then
            echo "Refusing alpha release: $SOURCE_SHA is not reachable from any branch of $GITHUB_REPOSITORY" >&2
            exit 1
          fi

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve the next alpha version
        id: version
        env:
          EXISTING_VERSION: ${{ inputs.existing_version }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "target_version must be X.Y.Z, got: $TARGET_VERSION" >&2
            exit 1
          fi

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          if [[ "$PACKAGE_NAME" != "@bnbagent/sdk" ]]; then
            echo "Refusing to publish unexpected package: $PACKAGE_NAME" >&2
            exit 1
          fi

          STABLE_VERSION="$(npm view "$PACKAGE_NAME@$TARGET_VERSION" version 2>/dev/null || true)"
          if [[ "$STABLE_VERSION" == "$TARGET_VERSION" ]]; then
            echo "Refusing to publish an alpha after stable $TARGET_VERSION" >&2
            exit 1
          fi

          SOURCE_SHA="$(git rev-parse HEAD)"
          ALPHA_VERSION="$(
            node <<'NODE'
          const { execFileSync } = require("node:child_process");

          const packageName = "@bnbagent/sdk";
          const target = process.env.TARGET_VERSION;
          const existing = process.env.EXISTING_VERSION;

          function versions() {
            try {
              const output = execFileSync(
                "npm",
                ["view", packageName, "versions", "--json"],
                {
                  encoding: "utf8",
                  stdio: ["ignore", "pipe", "pipe"],
                },
              );
              const parsed = JSON.parse(output || "[]");
              return Array.isArray(parsed)
                ? parsed
                : typeof parsed === "string"
                  ? [parsed]
                  : [];
            } catch (error) {
              const stderr = String(error.stderr || "");
              if (stderr.includes("E404")) return [];
              throw error;
            }
          }

          function alphaTag() {
            try {
              const output = execFileSync("npm", ["dist-tag", "ls", packageName], {
                encoding: "utf8",
                stdio: ["ignore", "pipe", "pipe"],
              });
              return output.match(/^alpha:\s+(\S+)$/m)?.[1];
            } catch (error) {
              const stderr = String(error.stderr || "");
              if (stderr.includes("E404")) return undefined;
              throw error;
            }
          }

          const published = new Set(versions());
          const tagged = alphaTag();
          if (tagged) published.add(tagged);

          if (existing) {
            const pattern = new RegExp(`^${target.replace(/\./g, "\\.")}-alpha\\.[0-9]+$`);
            if (!pattern.test(existing)) {
              throw new Error(`existing_version must match ${target}-alpha.N`);
            }
            if (!published.has(existing)) {
              throw new Error(`existing_version is not published: ${existing}`);
            }
            process.stdout.write(existing);
            process.exit(0);
          }

          const prefix = `${target}-alpha.`;
          const numbers = [...published]
            .filter((version) => version.startsWith(prefix))
            .map((version) => version.slice(prefix.length))
            .filter((suffix) => /^\d+$/.test(suffix))
            .map(Number);
          process.stdout.write(`${prefix}${Math.max(0, ...numbers) + 1}`);
          NODE
          )"

          echo "alpha_version=$ALPHA_VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Reuse trusted CI for the exact source commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
          TRUSTED_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          echo "reuse_ci=false" >> "$GITHUB_OUTPUT"
          echo "ci_run_url=" >> "$GITHUB_OUTPUT"

          if ! RUNS="$(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/typescript-ci.yml/runs" \
              -f head_sha="$SOURCE_SHA" \
              -f status=success \
              -f per_page=10
          )"; then
            echo "::warning::Could not read CI evidence; running fresh verification"
            exit 0
          fi

          while read -r RUN_ID; do
            [[ -n "$RUN_ID" ]] || continue
            if ! JOBS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs")"; then
              continue
            fi
            if jq -e '
              def passed($steps; $name):
                any($steps[]?; .name == $name and .conclusion == "success");
              any(
                .jobs[];
                .name == "check"
                  and .conclusion == "success"
                  and (
                    .steps as $steps
                    | passed($steps; "Regenerate ABIs and verify no drift")
                      and passed($steps; "Typecheck (src)")
                      and passed($steps; "Typecheck (examples)")
                      and passed($steps; "Lint")
                      and passed($steps; "Test")
                      and passed($steps; "Build")
                      and passed($steps; "Offline examples (self-contained, no network)")
                  )
              )
            ' <<<"$JOBS" >/dev/null; then
              echo "reuse_ci=true" >> "$GITHUB_OUTPUT"
              echo "ci_run_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
                >> "$GITHUB_OUTPUT"
              echo "Reusing successful CI run $RUN_ID for $SOURCE_SHA"
              exit 0
            fi
          done < <(
            jq -r \
              --arg branch "$TRUSTED_BRANCH" \
              --arg sha "$SOURCE_SHA" \
              '
                .workflow_runs[]
                | select(
                    .event == "push"
                    and .head_branch == $branch
                    and .head_sha == $sha
                    and .path == ".github/workflows/typescript-ci.yml"
                  )
                | .id
              ' <<<"$RUNS"
          )

          echo "No reusable trusted-branch CI run found for $SOURCE_SHA; running fresh verification"

  verify:
    name: Verify source (${{ matrix.check }})
    if: inputs.release_type == 'alpha' && needs.resolve.outputs.reuse_ci != 'true'
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - static
          - tests
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout the resolved source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: typescript/package.json

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification slice
        env:
          CHECK: ${{ matrix.check }}
        run: |
          set -euo pipefail
          case "$CHECK" in
            static)
              pnpm run codegen
              git diff --exit-code src/abis

              PIDS=()
              pnpm run typecheck &
              PIDS+=("$!")
              pnpm run typecheck:examples &
              PIDS+=("$!")
              pnpm run lint &
              PIDS+=("$!")

              FAILED=0
              for PID in "${PIDS[@]}"; do
                if ! wait "$PID"; then
                  FAILED=1
                fi
              done
              if [[ "$FAILED" -ne 0 ]]; then
                exit 1
              fi
              git diff --check
              ;;
            tests)
              pnpm run test
              ;;
            *)
              echo "Unknown verification slice: $CHECK" >&2
              exit 1
              ;;
          esac

  package:
    name: Build and verify the alpha tarball
    outputs:
      integrity: ${{ steps.pack.outputs.integrity }}
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
    if: inputs.release_type == 'alpha'
    needs: resolve
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout the resolved source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: typescript/package.json

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply alpha package metadata and build once
        env:
          ALPHA_VERSION: ${{ needs.resolve.outputs.alpha_version }}
        run: |
          # Align package metadata with the workflow identity before building.
          npm pkg set "version=$ALPHA_VERSION" \
            "repository.url=https://github.com/$GITHUB_REPOSITORY.git"
          npm pkg delete publishConfig
          pnpm run build
          git diff --check

      - name: Run offline examples
        run: |
          set -euo pipefail
          pnpm run example:x402 &
          X402_PID="$!"
          pnpm run example:security &
          SECURITY_PID="$!"

          FAILED=0
          for PID in "$X402_PID" "$SECURITY_PID"; do
            if ! wait "$PID"; then
              FAILED=1
            fi
          done
          exit "$FAILED"

      - name: Pack and verify the installable tarball
        id: pack
        env:
          ALPHA_VERSION: ${{ needs.resolve.outputs.alpha_version }}
        run: |
          set -euo pipefail
          PACK_DIR="$RUNNER_TEMP/npm-pack"
          CONSUMER_DIR="$(mktemp -d)"
          mkdir -p "$PACK_DIR"
          npm pack --ignore-scripts --json --pack-destination "$PACK_DIR" >/dev/null
          mapfile -t TARBALLS < <(find "$PACK_DIR" -maxdepth 1 -type f -name '*.tgz')
          if [[ "${#TARBALLS[@]}" -ne 1 ]]; then
            echo "Expected exactly one tarball, found ${#TARBALLS[@]}" >&2
            exit 1
          fi
          TARBALL_PATH="$PACK_DIR/bnbagent-sdk-$ALPHA_VERSION.tgz"
          if [[ "${TARBALLS[0]}" != "$TARBALL_PATH" ]]; then
            echo "Unexpected tarball filename: ${TARBALLS[0]}" >&2
            exit 1
          fi
          CLEAN_DIR="$RUNNER_TEMP/npm-clean"
          CLEAN_TARBALL="$CLEAN_DIR/bnbagent-sdk-$ALPHA_VERSION.tgz"
          mkdir -p "$CLEAN_DIR"
          pnpm exec tsx scripts/release.ts verify-tarball \
            "$TARBALL_PATH" \
            "$ALPHA_VERSION" \
            "https://github.com/$GITHUB_REPOSITORY.git" \
            --repack "$CLEAN_TARBALL"

          cd "$CONSUMER_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$CLEAN_TARBALL"
          node --input-type=module -e \
            "await import('@bnbagent/sdk'); const { getBuiltWithValue } = await import('@bnbagent/sdk/erc8004'); const expected = 'https://github.com/bnb-chain/bnbagent-sdk#v' + process.env.ALPHA_VERSION; if (getBuiltWithValue() !== expected) throw new Error('unexpected built_with version')"
          node -e \
            "require('@bnbagent/sdk'); require('@bnbagent/sdk/erc8004')"

          CLEAN_TARBALL="$CLEAN_TARBALL" node -e 'const fs=require("node:fs"),c=require("node:crypto"); console.log("integrity=sha512-"+c.createHash("sha512").update(fs.readFileSync(process.env.CLEAN_TARBALL)).digest("base64"))' >> "$GITHUB_OUTPUT"
          {
            echo "### npm alpha build: $ALPHA_VERSION"
            echo "Source: $(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
            echo "SHA-512 (hex): $(shasum -a 512 "$CLEAN_TARBALL" | cut -d ' ' -f 1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified tarball
        id: archive
        uses: actions/upload-artifact@v4
        with:
          name: bnbagent-sdk-${{ needs.resolve.outputs.alpha_version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-clean/*.tgz
          if-no-files-found: error
          retention-days: 7

  alpha-publish:
    name: Publish alpha to npm
    if: >-
      always() && !cancelled() &&
      inputs.release_type == 'alpha' &&
      needs.resolve.result == 'success' &&
      needs.package.result == 'success' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    needs: [resolve, verify, package]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/npm-publish-artifact.yml
    with:
      artifact_id: ${{ needs.package.outputs.artifact_id }}
      version: ${{ needs.resolve.outputs.alpha_version }}
      channel: alpha
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      integrity: ${{ needs.package.outputs.integrity }}

  production:
    name: Build production npm artifact
    if: inputs.release_type == 'production'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      source_sha: ${{ steps.handoff.outputs.source_sha }}
      integrity: ${{ steps.handoff.outputs.integrity }}
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
      version_artifact_id: ${{ steps.version_files.outputs.artifact-id }}
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: typescript/package.json

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify ABIs are in sync
        run: |
          pnpm run codegen
          git diff --exit-code src/abis

      - name: Prepare or resume version
        id: version
        run: pnpm exec tsx scripts/release.ts prepare "${{ inputs.bump }}" >> "$GITHUB_OUTPUT"

      - name: Check source and build
        run: |
          pnpm run typecheck
          pnpm run typecheck:examples
          pnpm run lint
          pnpm run test
          pnpm run build
          git diff --check

      - name: Generate release notes
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          pnpm exec tsx scripts/release.ts changelog > RELEASE_NOTES.md
          {
            echo
            echo "### Installation"
            echo
            echo '```bash'
            echo "pnpm add -E @bnbagent/sdk@$V"
            echo '```'
          } >> RELEASE_NOTES.md

      - name: Capture version files before packaging changes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-version"
          cp package.json pnpm-lock.yaml "$RUNNER_TEMP/npm-version/"

      - name: Freeze workspace dependencies for publishing
        run: pnpm exec tsx scripts/release.ts freeze

      - name: Align package metadata with the publishing repository
        # Apply metadata after capturing the version files for the API commit.
        run: |
          npm pkg set "repository.url=https://github.com/$GITHUB_REPOSITORY.git"
          npm pkg delete publishConfig

      - name: Pack and verify the installable tarball
        id: pack
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PACK_DIR="$RUNNER_TEMP/npm-pack"
          CONSUMER_DIR="$(mktemp -d)"
          mkdir -p "$PACK_DIR"
          npm pack --ignore-scripts --json --pack-destination "$PACK_DIR" >/dev/null
          mapfile -t TARBALLS < <(find "$PACK_DIR" -maxdepth 1 -type f -name '*.tgz')
          if [[ "${#TARBALLS[@]}" -ne 1 ]]; then
            echo "Expected exactly one tarball, found ${#TARBALLS[@]}" >&2
            exit 1
          fi
          TARBALL_PATH="$PACK_DIR/bnbagent-sdk-$V.tgz"
          if [[ "${TARBALLS[0]}" != "$TARBALL_PATH" ]]; then
            echo "Unexpected tarball filename: ${TARBALLS[0]}" >&2
            exit 1
          fi
          # Publish the archive re-encoded from the verified entries, never the
          # raw npm pack output.
          CLEAN_TARBALL="$RUNNER_TEMP/bnbagent-sdk-$V.clean.tgz"
          pnpm exec tsx scripts/release.ts verify-tarball \
            "$TARBALL_PATH" \
            "$V" \
            "https://github.com/$GITHUB_REPOSITORY.git" \
            --repack "$CLEAN_TARBALL"
          pnpm exec tsx scripts/release.ts verify-tarball \
            "$CLEAN_TARBALL" \
            "$V" \
            "https://github.com/$GITHUB_REPOSITORY.git"

          cd "$CONSUMER_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$CLEAN_TARBALL"
          node --input-type=module -e \
            "await import('@bnbagent/sdk'); const { getBuiltWithValue } = await import('@bnbagent/sdk/erc8004'); const expected = 'https://github.com/bnb-chain/bnbagent-sdk#v' + process.env.V; if (getBuiltWithValue() !== expected) throw new Error('unexpected built_with version')"
          node -e \
            "require('@bnbagent/sdk'); require('@bnbagent/sdk/erc8004')"
          echo "tarball=$CLEAN_TARBALL" >> "$GITHUB_OUTPUT"

      - name: Prepare production handoff
        id: handoff
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-release"
          cp "$TARBALL" "$RUNNER_TEMP/npm-release/bnbagent-sdk-$V.tgz"
          cp RELEASE_NOTES.md "$RUNNER_TEMP/npm-version/"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node -e 'const fs=require("node:fs"),c=require("node:crypto"); console.log("integrity=sha512-"+c.createHash("sha512").update(fs.readFileSync(process.env.TARBALL)).digest("base64"))' >> "$GITHUB_OUTPUT"
          {
            echo "### npm production build: $V"
            echo "Source: $(git rev-parse HEAD)"
            echo "SHA-512 (hex): $(shasum -a 512 "$TARBALL" | cut -d ' ' -f 1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production tarball
        id: archive
        uses: actions/upload-artifact@v4
        with:
          name: npm-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-release/*.tgz
          if-no-files-found: error

      - name: Upload production version files and notes
        id: version_files
        uses: actions/upload-artifact@v4
        with:
          name: npm-version-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-version/
          if-no-files-found: error

  version-commit:
    name: Commit production version through trusted API logic
    needs: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - name: Authorize release actors
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ACTOR_ID: ${{ github.actor_id }}
          RELEASE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          # Immutable GitHub IDs: jardenx, aiden-cao, robot-ux.
          allowed_release_actor() {
            case "$1" in
              274764117|104969608|81206731) return 0 ;;
              *) return 1 ;;
            esac
          }
          if ! allowed_release_actor "$RELEASE_ACTOR_ID"; then
            echo "Release initiator is not an approved publisher" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TRIGGERING_ACTOR" =~ ^[A-Za-z0-9][A-Za-z0-9-]*$ ]]; then
            echo "Invalid triggering actor" >&2
            exit 1
          fi
          TRIGGERING_ID="$(gh api --method GET "users/$RELEASE_TRIGGERING_ACTOR" --jq '.id')"
          if ! allowed_release_actor "$TRIGGERING_ID"; then
            echo "Release rerunner is not an approved publisher" >&2
            exit 1
          fi

      - name: Download version files
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.production.outputs.version_artifact_id }}
          merge-multiple: true
          path: version-files

      - name: Commit version bump through the GitHub API
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.production.outputs.version }}
          SOURCE_SHA: ${{ needs.production.outputs.source_sha }}
          COMMIT: ${{ needs.production.outputs.commit }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import base64
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          def api(endpoint, *args):
              return json.loads(subprocess.check_output(["gh", "api", endpoint, *args], text=True))

          version, sha = os.environ["V"], os.environ["SOURCE_SHA"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version) or not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("Invalid version commit identity")
          if sha != os.environ["GITHUB_SHA"]:
              raise SystemExit("Production source differs from the dispatch commit")
          if os.environ["COMMIT"] not in ("true", "false"):
              raise SystemExit("Invalid commit selection")
          repo = os.environ["GITHUB_REPOSITORY"]
          original = api(f"repos/{repo}/contents/typescript/package.json?ref={sha}")
          manifest = json.loads(base64.b64decode(original["content"]))
          manifest["version"] = version
          staged = json.loads(Path("version-files/package.json").read_text())
          if staged != manifest:
              raise SystemExit("Version artifact changes fields other than version")
          # This single-package lockfile has no root package version field.
          # Reject lockfile drift instead of committing arbitrary build output.
          lock = api(f"repos/{repo}/contents/typescript/pnpm-lock.yaml?ref={sha}")
          if Path("version-files/pnpm-lock.yaml").read_bytes() != base64.b64decode(lock["content"]):
              raise SystemExit("Release preparation changed lockfile; commit dependency changes separately")
          if os.environ["COMMIT"] == "true":
              query = "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid signature { isValid wasSignedByGitHub } } } }"
              payload = {"query": query, "variables": {"input": {
                  "branch": {"repositoryNameWithOwner": repo, "branchName": os.environ["BRANCH"]},
                  "expectedHeadOid": sha,
                  "message": {"headline": f"chore(release): v{version} [skip ci]"},
                  "fileChanges": {"additions": [{"path": "typescript/package.json", "contents": base64.b64encode((json.dumps(manifest, indent=2) + "\n").encode()).decode()}]},
              }}}
              response = subprocess.check_output(["gh", "api", "graphql", "--input", "-"], input=json.dumps(payload), text=True)
              result = json.loads(response)
              commit = (result.get("data") or {}).get("createCommitOnBranch", {}).get("commit") or {}
              signature = commit.get("signature") or {}
              if result.get("errors") or signature.get("isValid") is not True or signature.get("wasSignedByGitHub") is not True:
                  raise SystemExit("GitHub did not return a verified version commit")
              sha = commit.get("oid", "")
          else:
              if json.loads(base64.b64decode(original["content"])) != manifest:
                  raise SystemExit("No-commit release changes package version")
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("Invalid released commit SHA")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"commit_sha={sha}\n")
          PYTHON

  production-publish:
    needs: [production, version-commit]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/npm-publish-artifact.yml
    with:
      artifact_id: ${{ needs.production.outputs.artifact_id }}
      version: ${{ needs.production.outputs.version }}
      channel: latest
      source_sha: ${{ needs.production.outputs.source_sha }}
      integrity: ${{ needs.production.outputs.integrity }}

  production-release:
    needs: [production, version-commit, production-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Authorize release actors
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ACTOR_ID: ${{ github.actor_id }}
          RELEASE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          # Immutable GitHub IDs: jardenx, aiden-cao, robot-ux.
          allowed_release_actor() {
            case "$1" in
              274764117|104969608|81206731) return 0 ;;
              *) return 1 ;;
            esac
          }
          if ! allowed_release_actor "$RELEASE_ACTOR_ID"; then
            echo "Release initiator is not an approved publisher" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TRIGGERING_ACTOR" =~ ^[A-Za-z0-9][A-Za-z0-9-]*$ ]]; then
            echo "Invalid triggering actor" >&2
            exit 1
          fi
          TRIGGERING_ID="$(gh api --method GET "users/$RELEASE_TRIGGERING_ACTOR" --jq '.id')"
          if ! allowed_release_actor "$TRIGGERING_ID"; then
            echo "Release rerunner is not an approved publisher" >&2
            exit 1
          fi

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.production.outputs.version_artifact_id }}
          merge-multiple: true
          path: release-notes

      - name: Create Git tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.production.outputs.version }}
          RELEASE_SHA: ${{ needs.version-commit.outputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          TAG="@bnbagent/sdk@v$V"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$RELEASE_SHA" >/dev/null
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "@bnbagent/sdk v$V" --notes-file release-notes/RELEASE_NOTES.md --latest
